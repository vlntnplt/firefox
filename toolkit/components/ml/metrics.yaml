---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - "Core :: Machine Learning"

firefox.ai.runtime:
  engine_creation:
    type: event
    description: >
      One attempt to create an inference engine, whether it succeeded or
      failed.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1891685
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1997016
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2046983
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058478
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097021
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2063339
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2092194
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2092192
    data_reviews:
      - https://phabricator.services.mozilla.com/D238583
      - https://phabricator.services.mozilla.com/D270909
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2046983
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058478
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097021
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2063339
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2092192
    data_sensitivity:
      - interaction
    notification_emails:
      - firefox-ai-and-ml@mozilla.com
    expires: never
    extra_keys:
      flow_id: &flow_id
        type: string
        description: >
          Unique identifier of a flow, the sequence of events one user-level
          operation records. Used to correlate them across components. A run
          records the flow it is given, or else the flow of the request that
          created its engine.
      host_process: &host_process
        description: >
          The process serving the engine: "inference" for the content
          inference process, "hwinference" for the HWInference utility
          process.
        type: string
      engine_id:
        type: string
        description: The id of the engine.
      model_id:
        type: string
        description: >
          The model the engine loaded, as resolved from Remote Settings or the
          task's default when its creator named none. For a failed attempt,
          the model its creator asked for.
      backend:
        type: string
        description: >
          The backend the engine runs on, e.g. onnx, onnx-native, llama.cpp,
          openai.
      purpose:
        type: string
        description: >
          The purpose the engine was created with, or else its feature id.
          See purpose on engine_run.
      device_kind: &device_kind
        type: string
        description: >
          Kind of the device that loaded the model: cpu, gpu or npu. Only
          llama.cpp in the HWInference process reports it; null for every other
          engine.
      duration:
        type: quantity
        description: >
          How long the attempt took, in milliseconds, including any model
          download.
      outcome:
        type: string
        description: >
          How the attempt ended: success, error, or aborted when the caller
          gave it up or the engine was terminated under it. An aborted attempt
          is not a failed one.
      error:
        type: string
        description: >
          The name of the error a failed attempt threw, e.g. TypeError. Never
          the error's message. Null unless outcome is error.
      failed_step:
        type: string
        description: >
          What a failed attempt was doing when it failed. model-download or
          model-cache: the last model file the engine asked for could not be
          fetched, or could not be stored. runtime-load: the runtime could not
          be fetched. model-load: the backend did not start with the model.
          Null unless outcome is error, and for an attempt that failed before
          any of these steps.

  model_download:
    type: event
    description: >
      One download of the files of a model, recorded when it ends: once its
      engine reports it complete and every file has arrived or failed. Files
      read from the cache are not part of it, and a model read entirely from
      the cache records nothing. Neither does a download that never ends,
      because its process died or Firefox quit.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1891685
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2015825
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097021
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2063339
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097023
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2092192
    data_reviews:
      - https://phabricator.services.mozilla.com/D238583
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097021
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2063339
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097023
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2092192
    data_sensitivity:
      - interaction
    notification_emails:
      - firefox-ai-and-ml@mozilla.com
    expires: never
    extra_keys:
      engine_id:
        type: string
        description: The id of the engine the model is downloaded for.
      purpose:
        type: string
        description: >
          Who the download is for: the purpose its engine was created with, or
          else its feature id, as on engine_creation.
      model_id:
        type: string
        description: The model whose files are downloaded.
      model_revision:
        type: string
        description: The revision of the model.
      outcome:
        type: string
        description: >
          How the download ended: success when the last file fetched arrived,
          aborted when its caller gave that file up, error otherwise. An
          aborted download is not a failed one.
      error:
        type: string
        description: >
          The name of the error the last failed file threw, e.g. TypeError.
          Never the error's message. Null unless outcome is error.
      duration:
        type: quantity
        description: >
          Milliseconds from the start of the first file to the moment the last
          one arrived or failed.
      files:
        type: quantity
        description: How many files were downloaded.
      bytes:
        type: quantity
        description: The total size of the downloaded files, in bytes.
      failed_files:
        type: quantity
        description: How many files failed to download.

  model_deletion:
    type: event
    description: >
      The files of a model are deleted from the model hub's storage.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1966301
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097021
    data_reviews:
      - https://phabricator.services.mozilla.com/D249218
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097021
    data_sensitivity:
      - interaction
    notification_emails:
      - firefox-ai-and-ml@mozilla.com
    expires: never
    extra_keys:
      deleted_by:
        type: string
        description: >
          What deleted the model: the id of an engine, or the part of Firefox
          that asked, e.g. denylist, webextensions-uninstall.
      model_id:
        type: string
        description: The model whose files are deleted.
      model_revision:
        type: string
        description: The revision of the model.

  engine_run:
    type: event
    description: >
      One run of the inference engine, however it ended: who it was for, its
      outcome, and its performance and memory characteristics.
    extra_keys:
      flow_id: *flow_id
      host_process: *host_process
      cpu_milliseconds:
        description: >
          The CPU time, in milliseconds, the engine's process used during the
          run, all threads and cores combined. It is measured on the whole
          process, so runs that overlap in it share it. Null for a run that
          returned no response: the engine reports it with the response.
        type: quantity
      wall_milliseconds:
        description: The amount of wall time the run request took.
        type: quantity
      memory_bytes:
        description: >
          An estimate of the private physical memory of the engine's process
          after the run, in bytes. Null for a run that returned no response.
        type: quantity
      purpose:
        description: >
          Who the run is for: the product feature, e.g. link-preview,
          followed by what the run does when the feature runs a model in
          several ways, e.g. memories:index-store. A run that names none is
          recorded under the purpose its engine was created with, which is
          what a cloud engine sends to MLPA, or else under the engine's
          feature id.
        type: string
      outcome:
        description: >
          How the run ended: success, error, aborted when the caller gave it
          up, or limited when the service refused it for a rate limit (HTTP
          429). An aborted or limited run is not a failed one.
        type: string
      error:
        description: >
          The name of the error a failed run threw, e.g. TypeError, or
          InferenceProcessCrash when the engine's process died. Never the
          error's message. Null unless outcome is error.
        type: string
      http_status:
        description: >
          The HTTP status a service refused the run with, e.g. 401, 429, 500.
          Null when outcome is success or aborted, and for a failed run that
          got no HTTP response: a service that could not be reached, or an
          engine that runs on device.
        type: quantity
      engine_id:
        type: string
        description: >
          Similar to the feature id, but is used to ensure only one engine is created
          under this name.
      model_id:
        type: string
        description: >
          The identifier for what model is being used by the engine,
          e.g. Xenova/all-MiniLM-L6-v2
      backend:
        type: string
        description: The backend that is being used, e.g. onnx, onnx-native, llama.cpp
      backend_source_revision:
        type: string
        description: >
          Version identifier of the backend library. Populated per-backend when
          the running library exposes a version; null otherwise.
      device_kind: *device_kind
      input_tokens:
        description: The number of tokens in the input, when the backend reports it.
        type: quantity
      cached_input_tokens:
        description: >
          How many of the input tokens a completions endpoint read from its
          prompt cache, when it reports it.
        type: quantity
      output_tokens:
        description: The number of tokens generated, for text generation tasks.
        type: quantity
      time_to_first_chunk:
        description: >
          Milliseconds from the run request being dispatched until the first
          generated (non-prompt) chunk is received by the consumer. Measured in
          the parent process end-to-end, so it includes IPC and streaming
          overhead, and is populated for all streaming backends.
        type: quantity
      average_chunk_time:
        description: >
          The mean milliseconds elapsed between consecutive generated
          (non-prompt) chunks for a streamed text generation run. Null when
          fewer than two generated chunks were produced.
        type: quantity
      finish_reason:
        description: >
          Why a generation stopped, as its backend reports it: stop, length,
          tool_calls or content_filter from a completions endpoint; eos,
          length or cancelled from llama.cpp in the HWInference process. Null
          for the other backends, for a run that did not return, and for a
          completion whose stream ended before the service gave a reason: the
          answer was cut off.
        type: string
      system_memory_mb:
        description: The total physical system memory in MB.
        type: quantity
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1992779
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1997016
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2029250
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2016214
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2047026
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2046983
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058478
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097021
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2063339
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097023
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2092192
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1992779
      - https://phabricator.services.mozilla.com/D270909
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2016214
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2046983
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058478
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097021
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2063339
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097023
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2092192
    data_sensitivity:
      - interaction
    notification_emails:
      - firefox-ai-and-ml@mozilla.com
    expires: never

model_management:
  remove_initiated:
    type: event
    description: |
      Recorded when the user clicks on Remove from the three dots next to
      a model item or the remove button from the model details page
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1947256
    data_reviews:
      - https://phabricator.services.mozilla.com/D249462
    data_sensitivity:
      - interaction
    notification_emails:
      - firefox-ai-and-ml@mozilla.com
    extra_keys:
      extension_ids:
        description: Ids of the extensions that use this model
        type: string
      feature_ids:
        description: Ids of the engines that are linked to a feature
        type: string
      source:
        description: The location from which the link was clicked e.g., details, list
        type: string
      size:
        description: The size of the model in bytes
        type: quantity
      last_used:
        description: hourse since the model was used
        type: quantity
      last_install:
        description: hourse since the model was installed
        type: quantity
      model:
        description: The id of the model
        type: string
      version:
        description: version of the current model
        type: string
    expires: never

  remove_confirmation:
    type: event
    description: |
      Recorded when the user interacts with the
      panel to confirm removal of model
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1947256
    data_reviews:
      - https://phabricator.services.mozilla.com/D249462
    data_sensitivity:
      - interaction
    notification_emails:
      - firefox-ai-and-ml@mozilla.com
    extra_keys:
      extension_ids:
        description: Ids of the extensions that use this model
        type: string
      feature_ids:
        description: Ids of the engines that are linked to a feature
        type: string
      model:
        description: The id of the model
        type: string
      version:
        description: version of the current model
        type: string
      action:
