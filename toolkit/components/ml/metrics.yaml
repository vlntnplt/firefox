---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - "Core :: Machine Learning"

firefox.ai.runtime:
  session_start:
    type: event
    description: >
      Marks the beginning of an ML inference session or workflow.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1997016
    data_reviews:
      - https://phabricator.services.mozilla.com/D270909
    data_sensitivity:
      - interaction
    notification_emails:
      - firefox-ai-and-ml@mozilla.com
    expires: never
    extra_keys:
      flow_id: &flow_id
        type: string
        description: >
          Unique identifier for this ML workflow session. Used to correlate all
          events within this session across components.
      feature_id:
        type: string
        description: >
          The feature initiating this session
      interaction:
        type: string
        description: >
          The interaction type that initiated this session

  session_end:
    type: event
    description: >
      Marks the end of an ML inference session or workflow.
      This event is recorded when the session completes successfully or is terminated.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1997016
    data_reviews:
      - https://phabricator.services.mozilla.com/D270909
    data_sensitivity:
      - interaction
    notification_emails:
      - firefox-ai-and-ml@mozilla.com
    expires: never
    extra_keys:
      flow_id: *flow_id
      feature_id:
        type: string
        description: >
          The feature associated with this session.
      duration:
        type: quantity
        description: >
          Total session duration in milliseconds.
      status:
        type: string
        description: >
          Session completion status

  engine_creation:
    type: event
    description: >
      One attempt to create an inference engine, whether it succeeded or
      failed.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1891685
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1997016
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2046983
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058478
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097021
    data_reviews:
      - https://phabricator.services.mozilla.com/D238583
      - https://phabricator.services.mozilla.com/D270909
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2046983
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058478
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097021
    data_sensitivity:
      - interaction
    notification_emails:
      - firefox-ai-and-ml@mozilla.com
    expires: never
    extra_keys:
      flow_id: *flow_id
      host_process: &host_process
        description: >
          The process serving the engine: "inference" for the content
          inference process, "hwinference" for the HWInference utility
          process.
        type: string
      engine_id:
        type: string
        description: The id of the engine.
      model_id:
        type: string
        description: The model the engine was asked to load.
      backend:
        type: string
        description: >
          The backend the engine runs on, e.g. onnx, onnx-native, llama.cpp,
          openai.
      device_kind: &device_kind
        type: string
        description: >
          Kind of the device that loaded the model: cpu, gpu or npu. Only
          llama.cpp in the HWInference process reports it; null for every other
          engine.
      duration:
        type: quantity
        description: >
          How long the attempt took, in milliseconds, including any model
          download.
      outcome:
        type: string
        description: How the attempt ended, success or error.
      error:
        type: string
        description: >
          The name of the error a failed attempt threw, e.g. TypeError. Never
          the error's message. Null unless outcome is error.

  model_download:
    type: event
    description: >
      One download of the files of a model, recorded when it ends: once its
      engine reports it complete and every file has arrived or failed. Files
      read from the cache are not part of it, and a model read entirely from
      the cache records nothing. Neither does a download that never ends,
      because its process died or Firefox quit.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1891685
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2015825
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097021
    data_reviews:
      - https://phabricator.services.mozilla.com/D238583
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097021
    data_sensitivity:
      - interaction
    notification_emails:
      - firefox-ai-and-ml@mozilla.com
    expires: never
    extra_keys:
      engine_id:
        type: string
        description: The id of the engine the model is downloaded for.
      feature_id:
        type: string
        description: The feature id of the engine the model is downloaded for.
      model_id:
        type: string
        description: The model whose files are downloaded.
      model_revision:
        type: string
        description: The revision of the model.
      outcome:
        type: string
        description: >
          How the download ended: success when the last file fetched arrived,
          error otherwise.
      error:
        type: string
        description: >
          The class of the error the last failed file threw. Null unless
          outcome is error.
      duration:
        type: quantity
        description: >
          Milliseconds from the start of the first file to the moment the
          download is reported complete.
      files:
        type: quantity
        description: How many files were downloaded.
      bytes:
        type: quantity
        description: The total size of the downloaded files, in bytes.
      failed_files:
        type: quantity
        description: How many files failed to download.

  model_deletion:
    type: event
    description: >
      The files of a model are deleted from the model hub's storage.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1966301
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097021
    data_reviews:
      - https://phabricator.services.mozilla.com/D249218
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097021
    data_sensitivity:
      - interaction
    notification_emails:
      - firefox-ai-and-ml@mozilla.com
    expires: never
    extra_keys:
      deleted_by:
        type: string
        description: >
          What deleted the model: the id of an engine, or the part of Firefox
          that asked, e.g. denylist, webextensions-uninstall.
      model_id:
        type: string
        description: The model whose files are deleted.
      model_revision:
        type: string
        description: The revision of the model.

  engine_run:
    type: event
    description: >
      One run of the inference engine, however it ended: its outcome, and its
      performance and memory characteristics.
    extra_keys:
      flow_id: *flow_id
      host_process: *host_process
      cpu_milliseconds:
        description: The combined milliseconds of every cpu core that was running.
        type: quantity
      wall_milliseconds:
        description: The amount of wall time the run request took.
        type: quantity
      cores:
        description: The number of cores on the machine.
        type: quantity
      cpu_utilization:
        description: The percentage of the user's CPU used.
        type: quantity
      memory_bytes:
        description: The number of RSS bytes for the inference process.
        type: quantity
      feature_id:
        description: >
          A unique id to describe the feature. e.g. pdfjs-alt-text, suggest-NER,
          link-preview.
        type: string
      outcome:
        description: >
          How the run ended: success or error.
        type: string
      error:
        description: >
          The name of the error a failed run threw, e.g. TypeError. Never the
          error's message. Null unless outcome is error.
        type: string
      engine_id:
        type: string
        description: >
          Similar to the feature id, but is used to ensure only one engine is created
          under this name.
      model_id:
        type: string
        description: >
          The identifier for what model is being used by the engine,
          e.g. Xenova/all-MiniLM-L6-v2
      backend:
        type: string
        description: The backend that is being used, e.g. onnx, onnx-native, llama.cpp
      backend_source_revision:
        type: string
        description: >
          Version identifier of the backend library. Populated per-backend when
          the running library exposes a version; null otherwise.
      device_kind: *device_kind
      input_tokens:
        description: The number of tokens in the input, when the backend reports it.
        type: quantity
      output_tokens:
        description: The number of tokens generated, for text generation tasks.
        type: quantity
      character_count:
        description: The number of characters generated for text generation tasks.
        type: quantity
      time_to_first_chunk:
        description: >
          Milliseconds from the run request being dispatched until the first
          generated (non-prompt) chunk is received by the consumer. Measured in
          the parent process end-to-end, so it includes IPC and streaming
          overhead, and is populated for all streaming backends.
        type: quantity
      average_chunk_time:
        description: >
          The mean milliseconds elapsed between consecutive generated
          (non-prompt) chunks for a streamed text generation run. Null when
          fewer than two generated chunks were produced.
        type: quantity
      system_memory_mb:
        description: The total physical system memory in MB.
        type: quantity
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1992779
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1997016
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2029250
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2016214
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2047026
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2046983
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058478
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097021
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1992779
      - https://phabricator.services.mozilla.com/D270909
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2016214
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2046983
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058478
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097021
    data_sensitivity:
      - interaction
    notification_emails:
      - firefox-ai-and-ml@mozilla.com
    expires: never

model_management:
  remove_initiated:
    type: event
    description: |
      Recorded when the user clicks on Remove from the three dots next to
      a model item or the remove button from the model details page
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1947256
    data_reviews:
      - https://phabricator.services.mozilla.com/D249462
    data_sensitivity:
      - interaction
    notification_emails:
      - firefox-ai-and-ml@mozilla.com
    extra_keys:
      extension_ids:
        description: Ids of the extensions that use this model
        type: string
      feature_ids:
        description: Ids of the engines that are linked to a feature
        type: string
      source:
        description: The location from which the link was clicked e.g., details, list
        type: string
      size:
        description: The size of the model in bytes
        type: quantity
      last_used:
        description: hourse since the model was used
        type: quantity
      last_install:
        description: hourse since the model was installed
        type: quantity
      model:
        description: The id of the model
        type: string
      version:
        description: version of the current model
        type: string
    expires: never

  remove_confirmation:
    type: event
    description: |
      Recorded when the user interacts with the
      panel to confirm removal of model
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1947256
    data_reviews:
      - https://phabricator.services.mozilla.com/D249462
    data_sensitivity:
      - interaction
    notification_emails:
      - firefox-ai-and-ml@mozilla.com
    extra_keys:
      extension_ids:
        description: Ids of the extensions that use this model
        type: string
      feature_ids:
        description: Ids of the engines that are linked to a feature
        type: string
      model:
        description: The id of the model
        type: string
      version:
        description: version of the current model
        type: string
      action:
        description: The action that was taken by the user, remove or cancel
        type: string
    expires: never

  list_item_manage:
    type: event
    description: |
      Recorded when the user clicks on Manage from the three
      dots next to a model item
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1947256
